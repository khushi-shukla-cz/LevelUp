version: '3.9'

services:
  # ─── Code Execution Microservice ───────────────────────────────────────────
  executor:
    build:
      context: ./packages/executor
      dockerfile: Dockerfile
    container_name: levelup_executor
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-development}
      - EXECUTION_TIMEOUT=${EXECUTION_TIMEOUT:-10000}
      - MAX_MEMORY=${MAX_MEMORY:-128m}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - executor_tmp:/tmp/executions
    networks:
      - levelup_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── API Server ────────────────────────────────────────────────────────────
  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: levelup_server
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=file:/app/data/levelup.db
      - JWT_SECRET=${JWT_SECRET:-supersecret_change_in_production_levelup_2024}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - EXECUTOR_URL=http://executor:5000
      - CLIENT_URL=http://localhost:5173
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
    volumes:
      - db_data:/app/data
    depends_on:
      executor:
        condition: service_healthy
    networks:
      - levelup_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── React Frontend ────────────────────────────────────────────────────────
  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:4000}
    container_name: levelup_client
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - levelup_net
    restart: unless-stopped

volumes:
  db_data:
  executor_tmp:

networks:
  levelup_net:
    driver: bridge
