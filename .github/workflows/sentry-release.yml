name: Upload Sentry sourcemaps

on:
  push:
    branches: [ main ]

jobs:
  sentry-release:
    name: Create Sentry release and upload sourcemaps
    runs-on: ubuntu-latest
    if: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build client
        run: |
          cd packages/client
          npm ci
          npm run build

      - name: Install sentry-cli
        run: npm install -g @sentry/cli

      - name: Create release and upload sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -e
          RELEASE=${{ github.sha }}
          echo "Creating Sentry release $RELEASE"
          sentry-cli releases -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" new "$RELEASE"
          sentry-cli releases -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" files "$RELEASE" upload-sourcemaps ./packages/client/dist --url-prefix "~/"
          sentry-cli releases -o "$SENTRY_ORG" -p "$SENTRY_PROJECT" finalize "$RELEASE"
